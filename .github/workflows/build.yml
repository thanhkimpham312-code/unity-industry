name: Build Unity Industry

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Check source and recipes
        run: |
          python3 scripts/verify-content.py
          python3 scripts/test-station-recipes.py
          bash scripts/test-core-rules.sh

      - name: Check dynamic skill mapping
        run: |
          mkdir -p build/skill-check
          javac -d build/skill-check src/main/java/com/unityindustry/rules/CoreType.java src/main/java/com/unityindustry/rules/SkillCatalog.java tools/DynamicSkillSelfTest.java
          java -cp build/skill-check DynamicSkillSelfTest

      - name: Build Fabric mod
        run: gradle build --no-daemon --stacktrace

      - name: Verify and package playable JAR
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          MOD_BASE="$(sed -n 's/^archives_base_name=//p' gradle.properties | tr -d '\r')"
          test -n "$MOD_VERSION" && test -n "$MOD_BASE"
          JAR_PATH="build/libs/${MOD_BASE}-${MOD_VERSION}.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::Playable JAR not found: $JAR_PATH"
            ls -lah build/libs
            exit 1
          fi
          unzip -t "$JAR_PATH" >/dev/null
          mkdir -p dist
          unzip -Z -1 "$JAR_PATH" > dist/JAR_CONTENTS.txt
          grep -Fxq 'fabric.mod.json' dist/JAR_CONTENTS.txt
          grep -Fxq 'com/unityindustry/UnityIndustry.class' dist/JAR_CONTENTS.txt
          cp "$JAR_PATH" dist/UnityIndustry-Playable.jar
          (cd dist && sha256sum UnityIndustry-Playable.jar > SHA256SUMS.txt)
          printf 'Git commit: %s\nOriginal JAR: %s\n' "$GITHUB_SHA" "$JAR_PATH" > dist/BUILD_INFO.txt

      - name: Upload playable JAR
        uses: actions/upload-artifact@v4
        with:
          name: UnityIndustry-Playable-With-SHA256
          path: dist/UnityIndustry-Playable.jar
          if-no-files-found: error

      - name: Upload text verification report
        uses: actions/upload-artifact@v4
        with:
          name: UnityIndustry-Build-Verification-Report
          path: |
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
            dist/JAR_CONTENTS.txt
          if-no-files-found: error
