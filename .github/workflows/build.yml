name: Build Unity Industry

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Verify project files (no external scripts needed)
        shell: bash
        run: |
          set -euo pipefail
          test -s build.gradle
          test -s gradle.properties
          test -s src/main/resources/fabric.mod.json
          python3 -m json.tool src/main/resources/fabric.mod.json > /dev/null
          echo 'Basic source files and fabric.mod.json: OK'

      - name: Build Fabric mod
        run: gradle build --no-daemon --stacktrace

      - name: Verify and package playable JAR
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          MOD_BASE="$(sed -n 's/^archives_base_name=//p' gradle.properties | tr -d '\r')"
          test -n "$MOD_VERSION" && test -n "$MOD_BASE"
          JAR_PATH="build/libs/${MOD_BASE}-${MOD_VERSION}.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "::error::Expected playable JAR is missing: $JAR_PATH"
            ls -lah build/libs/ || true
            exit 1
          fi
          mkdir -p dist
          unzip -t "$JAR_PATH" > /dev/null
          unzip -Z -1 "$JAR_PATH" > dist/JAR_CONTENTS.txt
          grep -Fxq 'fabric.mod.json' dist/JAR_CONTENTS.txt
          grep -Fxq 'com/unityindustry/UnityIndustry.class' dist/JAR_CONTENTS.txt
          if grep -Eiq '\.(exe|dll|bat|cmd|ps1|vbs|scr)$' dist/JAR_CONTENTS.txt; then
            echo '::error::Unexpected executable-like file found inside JAR'
            exit 1
          fi
          cp "$JAR_PATH" dist/UnityIndustry-Playable.jar
          (cd dist && sha256sum UnityIndustry-Playable.jar > SHA256SUMS.txt)
          printf 'Git commit: %s\nOriginal JAR: %s\n' "$GITHUB_SHA" "$JAR_PATH" > dist/BUILD_INFO.txt

      - name: Upload playable JAR
        uses: actions/upload-artifact@v4
        with:
          name: UnityIndustry-Playable-With-SHA256
          path: dist/UnityIndustry-Playable.jar
          if-no-files-found: error

      - name: Upload text verification report
        uses: actions/upload-artifact@v4
        with:
          name: UnityIndustry-Build-Verification-Report
          path: |
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
            dist/JAR_CONTENTS.txt
          if-no-files-found: error
